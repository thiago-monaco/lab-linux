  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "81:81"
      - "8443:443"
    volumes:
      - ./npm-data/data:/data
      - ./npm-data/letsencrypt:/etc/letsencrypt
    depends_on:
      - guacamole
