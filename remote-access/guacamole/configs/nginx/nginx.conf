events { 
    worker_connections 1024; 
}

http {
    # Ajuste para permitir upload de arquivos grandes se precisar
    client_max_body_size 100M;

    server {
        listen 443 ssl;
        server_name localhost;

        # Onde o Nginx vai procurar os certificados que vamos gerar
        ssl_certificate /etc/nginx/certs/guacamole.crt;
        ssl_certificate_key /etc/nginx/certs/guacamole.key;

        # Configurações de segurança SSL básicas
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            # O nome 'guacamole' aqui deve ser igual ao nome do serviço no seu docker-compose.yml
            proxy_pass http://guacamole:8080/guacamole/;
            
            # Configurações necessárias para o Guacamole não desconectar
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
            proxy_cookie_path /guacamole/ /;
            access_log off;
        }
    }
}
