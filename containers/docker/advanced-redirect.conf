# ----------------------------------------------------------------------
# Configuração Avançada (Aba Advanced do Nginx Proxy Manager)
# Objetivo: Forçar o redirecionamento automático da raiz do domínio 
# para a subpasta do serviço (ex: Guacamole) sem expor a tela padrão do Nginx.
# ----------------------------------------------------------------------

location = / {
    return 301 /guacamole/;
}
