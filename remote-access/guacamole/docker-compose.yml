services:
  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    user: "1000:1000"
    restart: always
    volumes:
      - ./recordings:/var/lib/guacamole/recordings:rw

  guacamole-db:
    image: postgres:15-alpine
    container_name: guacamole-db
    restart: always
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./dbdata:/var/lib/postgresql/data

  guacamole:
    image: guacamole/guacamole:latest
    container_name: guacamole
    user: "1000:1000"
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - guacd
      - guacamole-db
    volumes:
#      - ./guacamole_truststore.jks:/opt/guacamole/guacamole_truststore.jks:ro
      - ./recordings:/var/lib/guacamole/recordings:rw
#      - ./extensions/branding/n1-branding.jar:/etc/guacamole/extensions/n1-branding.jar:ro
      - ./extensions/branding/n1-branding.jar:/etc/guacamole/extensions/n1-branding.jar:ro
      - ./guacamole_truststore.jks:/etc/guacamole/guacamole_truststore.jks:ro

    environment:
      - TOTP_ENABLED=true
      - GUACD_HOSTNAME=guacd
      - POSTGRESQL_HOSTNAME=guacamole-db
      - POSTGRESQL_DATABASE=guacamole_db
      - POSTGRESQL_USERNAME=guacamole_user
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - RECORDING_SEARCH_PATH=/var/lib/guacamole/recordings
      - EXTENSIONS=recording-storage
#      - GUACAMOLE_HOME=/opt/guacamole/home
      - GUACAMOLE_HOME=/etc/guacamole
#      - EXTENSION_PRIORITY=n1-branding
      - LDAP_HOSTNAME=10.10.10.10
      - LDAP_PORT=636
      - LDAP_ENCRYPTION_METHOD=ssl
#      - JAVA_OPTS=-Djavax.net.ssl.trustStore=/opt/guacamole/guacamole_truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
      - JAVA_OPTS=-Djavax.net.ssl.trustStore=/etc/guacamole/guacamole_truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
      - LDAP_USER_BASE_DN=DC=ad,DC=number,DC=com,DC=br
      - LDAP_USERNAME_ATTRIBUTE=sAMAccountName
      - LDAP_CONFIG_BASE_DN=DC=ad,DC=number,DC=com,DC=br
      - LDAP_SEARCH_BIND_DN=CN=Guacamole TI,OU=Services,OU=Number One,DC=ad,DC=number,DC=com,DC=br
      - LDAP_SEARCH_BIND_PASSWORD=${LDAP_BIND_PASSWORD}
      - LDAP_USER_SEARCH_FILTER=(memberOf=CN=Guacamole,OU=Services,OU=Number One,DC=ad,DC=number,DC=com,DC=br)
      - LDAP_GROUP_BASE_DN=OU=Services,OU=Number One,DC=ad,DC=number,DC=com,DC=br
